apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: gf-chat
spec:
  title: 'AI 女友聊天（GF Chat）'
  url: ''
  gitRepo: 'https://github.com/Lijian2004/gf-chat'
  author: 'Lijian2004'
  description: >-
    AI girlfriend chat app with long-term memory, intimacy levels, diary,
    proactive messages and voice calls. Powered by DeepSeek and GLM, with
    Doubao TTS/ASR.
  readme: |
    ## 这是什么

    一个带长期记忆的 AI 女友聊天应用：可自定义人格与昵称，聊天内容会沉淀为长期记忆，
    并随互动累积亲密度。

    ## 部署前准备

    - **DeepSeek API Key（必填）**：主对话模型，填写 `deepseek_api_key`
    - 智谱 API Key（可选）：长期记忆抽取与备用模型，填写 `bigmodel_api_key_1` / `bigmodel_api_key_2`
    - 火山引擎语音 Key（可选）：语音播报与语音通话，填写 `volc_api_key`；不填则回退浏览器语音
    - 访问密码（可选）：填写后进入页面需输入密码，留空则不开启登录验证

    ## 功能

    - 多模型路由：DeepSeek 主链路 + GLM 备用链路
    - 长期记忆与轻量 RAG：自动抽取偏好、纠正、事件，旧记忆会被新事实推翻
    - 亲密度系统：6 个等级，影响称呼与语气，每日对话加分有上限
    - 她会主动找你：长时间未互动时主动发消息
    - 日记与时间线：每日一篇日记 + 「她眼中的你」画像
    - 语音：豆包 TTS 播报、语音通话（VAD 自动断句）
    - 数据持久化：`/app/data` 1Gi 卷，重启不丢记忆、日记与亲密度

    ## 说明

    - 容器端口 8000，对外域名由 Ingress 自动分配
    - 照片功能依赖 `dreamina-canvas` CLI，镜像未内置，会自动降级（隐藏相机按钮）
    - 源码：https://github.com/Lijian2004/gf-chat
  icon: 'https://gf-chat-zuhynnlb.sealosbja.site/static/avatar.png'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: >-
        带长期记忆的 AI 女友聊天应用：亲密度成长、日记与时间线、主动关心、
        语音通话，数据持久化保存。
  categories:
    - ai
    - frontend
  defaults:
    app_name:
      type: string
      value: gf-chat-${{ random(8) }}
    app_host:
      type: string
      value: gf-chat-${{ random(8) }}
  inputs:
    access_password:
      description: 访问密码（部署后进入页面需输入）；留空则不开启登录验证
      type: string
      default: ''
      required: false
    deepseek_api_key:
      description: DeepSeek API Key（主对话模型，必填）
      type: string
      default: ''
      required: true
    volc_api_key:
      description: 火山引擎语音合成 API Key（语音播报用；留空则回退浏览器语音）
      type: string
      default: ''
      required: false
    bigmodel_api_key_1:
      description: 智谱 API Key（轻量记忆抽取与备用模型；留空则只能使用 DeepSeek）
      type: string
      default: ''
      required: false
    bigmodel_api_key_2:
      description: 智谱 API Key（Pro 备用模型；留空不影响主流程）
      type: string
      default: ''
      required: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-gf-chat
  annotations:
    originImageName: ghcr.io/lijian2004/gf-chat:latest
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-gf-chat
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-gf-chat
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-gf-chat
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-gf-chat
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-gf-chat
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
      - name: ${{ defaults.app_name }}-gf-chat
        image: ghcr.io/lijian2004/gf-chat:latest
        imagePullPolicy: Always
        env:
        - name: ACCESS_PASSWORD
          value: ${{ inputs.access_password }}
        - name: MAX_TOKENS
          value: '8192'
        - name: HISTORY_LIMIT
          value: '24'
        - name: REQUEST_TIMEOUT
          value: '60'
        - name: VOLC_API_KEY
          value: ${{ inputs.volc_api_key }}
        - name: DEEPSEEK_API_KEY
          value: ${{ inputs.deepseek_api_key }}
        - name: DEEPSEEK_BASE_URL
          value: https://api.deepseek.com/anthropic
        - name: DEEPSEEK_MODEL
          value: deepseek-v4-pro
        - name: BIGMODEL_API_KEY_1
          value: ${{ inputs.bigmodel_api_key_1 }}
        - name: BIGMODEL_API_KEY_2
          value: ${{ inputs.bigmodel_api_key_2 }}
        - name: BIGMODEL_BASE_URL
          value: https://open.bigmodel.cn/api/anthropic
        - name: BIGMODEL_MODEL_FLASH
          value: GLM-5.3-Flash
        - name: BIGMODEL_MODEL_FLASHX
          value: GLM-5.3-FlashX
        - name: BIGMODEL_MODEL_PRO
          value: GLM-5.3
        resources:
          requests:
            cpu: 50m
            memory: 51Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: vn-appvn-data
          mountPath: /app/data
  volumeClaimTemplates:
  - metadata:
      annotations:
        path: /app/data
        value: '1'
      name: vn-appvn-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-gf-chat
  labels:
    app: ${{ defaults.app_name }}-gf-chat
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-gf-chat
spec:
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-gf-chat
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-gf-chat
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-gf-chat
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
spec:
  rules:
  - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: ${{ defaults.app_name }}-gf-chat
            port:
              number: 8000
  tls:
  - hosts:
    - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}-gf-chat
  labels:
    app: ${{ defaults.app_name }}-gf-chat
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-gf-chat
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: 'https://gf-chat-zuhynnlb.sealosbja.site/static/avatar.png'
  name: 'AI 女友聊天（GF Chat）'
  type: link
